name: 功能建议 / Feature Request
description: 对 OPPO Pods Manager 提出功能建议或改进想法 / Suggest a new feature or improvement for OPPO Pods Manager
title: "[建议] / [Suggestion] "
labels: ["enhancement"]
body:
  - type: textarea
    id: feature-description
    attributes:
      label: 功能描述 / Feature Description
      description: 简单描述你想要的功能或改进 / Briefly describe the feature or improvement you'd like
      placeholder: 比如：希望增加电量过低时弹窗提醒 / e.g. Add a popup notification when battery is low
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: 使用场景 / Use Case
      description: 什么情况下会用到这个功能，能解决什么问题 / In what scenario would this feature be used? What problem does it solve?
      placeholder: 当我戴着耳机打游戏时，电量低了自己不会注意... / When I'm gaming with earbuds, I don't notice the low battery...
    validations:
      required: true
